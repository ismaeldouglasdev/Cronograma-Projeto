[project]
name = "cronograma"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.uv]
python = "3.11"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning:starlette\\.formparsers",
]

[tool.basedpyright]
# Testes rodam via pytest a partir de cronograma/app (padrão pytest de raiz).
# Imports de/para módulos do app são resolvidos pelo sys.path do pytest.
reportImplicitRelativeImport = "none"
