<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritmo Exato - Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 2rem; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; }
    p { color: #cbd5e1; line-height: 1.6; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.25rem; border-radius: 0.5rem; background: #6366f1; color: #fff; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Você está offline</h1>
    <p>Não foi possível carregar esta página agora. Verifique sua conexão e tente novamente. O app continua disponível neste dispositivo quando a conexão voltar.</p>
    <a href="/app">Tentar novamente</a>
  </main>
</body>
</html>
