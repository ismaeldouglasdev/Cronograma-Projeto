services:
  - type: web
    name: cronograma-projeto
    runtime: python
    rootDir: cronograma
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: ENVIRONMENT
        value: production
